<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI (slop) game generator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>AI slop game generator</h1>

    <section id="ideasection">
        <h3>Prompt making</h3>

        <label for="startprompt">Make your first prompt:</label>
        <form id="startprompt">
            <input placeholder="Your game idea here" id="gameidea" name="gameidea"><br>
            <input type="checkbox" id="1000timesbetter" name="1000timesbetter" value="true">
            <label for="1000timesbetter"> Make it 1000 times better?</label><br>
            <input type="checkbox" id="extrafunny" name="extrafunny" value="true">
            <label for="extrafunny"> Make it extra funny?</label><br>
            <input type="checkbox" id="nomistakes" name="nomistakes" value="true">
            <label for="nomistakes"> Make no mistakes?</label><br>
            <input placeholder="Your game's coding language here" id="clanguage" name="clanguage"><br>
            <label for="dimension">Game dimension:</label>
            <select name="dimension" id="dimension">
                <option value="2D">2D</option>
                <option value="2.5D">2.5D</option>
                <option value="3D">3D</option>
            </select> <br>

            <input type="submit" id="submit1" disabled>
        </form>
    </section>

    <section id="outputsection">
        <h3>Output prompt</h3>

        <textarea readonly id="output">Output prompt will appear here...</textarea>
    </section>

    <section id="followupsection">
        <h3>Follow-up prompt making</h3>

        <label for="followupprompt">Make your follow-up prompt:</label>
        <form id="followupprompt">
            <input placeholder="New feature idea" id="featureidea" name="featureidea"><br>
            <input type="checkbox" id="newfeature" name="newfeature" value="true">
            <label for="newfeature"> Add the feature you wanted?</label><br>
            <input type="checkbox" id="1000timesbetter2" name="1000timesbetter2" value="true">
            <label for="1000timesbetter2"> Make it 1000 times better?</label><br>
            <input type="checkbox" id="extrafunny2" name="extrafunny2" value="true">
            <label for="extrafunny2"> Make it even more funny?</label><br>
            <input type="checkbox" id="nomistakes2" name="nomistakes2" value="true">
            <label for="nomistakes2"> Make no mistakes?</label><br>
            <input type="checkbox" id="fixbugs" name="fixbugs" value="true">
            <label for="fixbugs"> Fix all bugs?</label><br>
            <input type="checkbox" id="morefeatures" name="morefeatures" value="true">
            <label for="morefeatures"> Add more features?</label><br>
            <input type="checkbox" id="commit" name="commit" value="true">
            <label for="commit"> Commit to GitHub?</label>
            <input placeholder="Repo link (public)" id="repolink" name="repolink"><br>

            <input type="submit" id="submit2" disabled>
        </form>
    </section>
    <script src="script.js" type="module"></script>
</body>
</html>
